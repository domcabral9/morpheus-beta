name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Mesma versão do runtime usado nas imagens de produção
      # (apps/api/Dockerfile e apps/web/Dockerfile: node:26-alpine). Elevado
      # de 22 -> 26 na migração pra NestJS 12 (2026-09-26) - os pacotes core
      # da v12 são ESM-only, e o teste do apps/api precisa de Node >=24.9
      # (junto com --experimental-vm-modules) pra conseguir requerer esses
      # pacotes a partir de um teste CommonJS. Node 22 nunca teria essa via
      # nativa disponível, independente de flag.
      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      # A partir do Node 26, o corepack deixou de vir embutido - mesmo gotcha
      # já documentado e corrigido nos Dockerfiles (docs/DEVELOPMENT.md).
      - name: Enable Corepack (pnpm via packageManager do package.json)
        run: npm install -g corepack@latest && corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cada task abaixo já reflete exatamente o que se roda localmente antes
      # de todo PR neste projeto (ver docs/DEVELOPMENT.md) - turbo resolve a
      # ordem certa via dependsOn (ex.: @morpheus/database precisa buildar/
      # gerar o Prisma Client antes de @morpheus/api tipar).
      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Lint
        run: pnpm turbo run lint

      - name: Test
        run: pnpm turbo run test

      - name: Build
        run: pnpm turbo run build
