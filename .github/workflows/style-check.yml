name: Style Check

on:
  pull_request:
    branches: [main]

jobs:
  style-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      # Só falha o job nas regras mecânicas (em-dash, assinatura de IA) -
      # scripts/check-style.mjs. Contraste negativo redundante fica só como
      # log informativo (regra semântica, o teste prático de docs/style-guide.md
      # decide caso a caso - ver comentário no topo do script). Job
      # independente do "validate" existente em ci.yml.
      - name: Checar .md alterados contra docs/style-guide.md
        run: |
          mapfile -t FILES < <(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- '*.md')
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "Nenhum .md alterado neste PR."
            exit 0
          fi
          node scripts/check-style.mjs "${FILES[@]}"
