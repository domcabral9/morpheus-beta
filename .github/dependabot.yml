version: 2

updates:
  # Monorepo pnpm com lockfile único na raiz - apontar "/" já cobre
  # apps/api, apps/web, packages/database e packages/config de uma vez
  # (Dependabot detecta pnpm-workspace.yaml/pnpm-lock.yaml automaticamente).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/apps/api"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/apps/web"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
