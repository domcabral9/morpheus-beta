packages:
  - "apps/*"
  - "packages/*"
overrides:
  # Correção manual de alertas do Dependabot (janela de 2026-08-11) sem PR
  # associada - são todos dependências transitivas de ferramental (jest,
  # eslint, @nestjs/cli, prisma dev), sem caminho de update automático do
  # Dependabot. Seletor por major evita forçar uma major-line que o pai não
  # pediu (ex. js-yaml@4.3.0 já está limpo e não deve virar 3.x/5.x).
  js-yaml@3: ^3.15.1 # GHSA-5p4m-2wfm-xmqj
  js-yaml@5: ^5.2.2 # GHSA-pm4m-ph32-ghv5
  brace-expansion@1: ^1.1.17 # GHSA-mh99-v99m-4gvg
  brace-expansion@2: ^2.1.3 # GHSA-mh99-v99m-4gvg
  brace-expansion@5: ^5.0.9 # GHSA-rgw5-rvv9-x895
  postcss@8: ^8.5.23 # GHSA-fxqj-rqcc-2cmp, GHSA-r28c-9q8g-f849, GHSA-6g55-p6wh-862q, GHSA-qx2v-qp2m-jg93
  fast-uri@3: ^3.1.5 # GHSA-7p8r-x3mc-p8w7, GHSA-v2hh-gcrm-f6hx
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  bcrypt: true
  esbuild: true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
