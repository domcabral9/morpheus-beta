packages:
  - "apps/*"
  - "packages/*"
overrides:
  # Correção manual de alertas do Dependabot (janela de 2026-08-11) sem PR
  # associada - são todos dependências transitivas de ferramental (jest,
  # eslint, @nestjs/cli, prisma dev), sem caminho de update automático do
  # Dependabot. Seletor por major evita forçar uma major-line que o pai não
  # pediu.
  js-yaml@3: ^3.15.1 # GHSA-5p4m-2wfm-xmqj
  js-yaml@4: ^4.3.1 # GHSA-5p4m-2wfm-xmqj (faixa 4.x adicionada ao advisory em 2026-08-11)
  js-yaml@5: ^5.2.2 # GHSA-pm4m-ph32-ghv5
  brace-expansion@1: ^1.1.17 # GHSA-mh99-v99m-4gvg
  brace-expansion@2: ^2.1.3 # GHSA-mh99-v99m-4gvg
  brace-expansion@5: ^5.0.9 # GHSA-rgw5-rvv9-x895
  postcss@8: ^8.5.23 # GHSA-fxqj-rqcc-2cmp, GHSA-r28c-9q8g-f849, GHSA-6g55-p6wh-862q, GHSA-qx2v-qp2m-jg93
  fast-uri@3: ^3.1.5 # GHSA-7p8r-x3mc-p8w7, GHSA-v2hh-gcrm-f6hx
  # Adicionado 2026-08-25 (alerta #38) - transitiva de prisma (CLI, devDependency)
  # -> @prisma/config, sem manifesto próprio pro Dependabot propor um PR.
  deepmerge-ts@7: ^8.0.0 # GHSA-ggr8-5vv4-36mx
  # Adicionado 2026-09-17 (alertas #43, #52-#60) - transitiva de
  # @node-saml/node-saml (xml-crypto, xml-encryption), todos pinados em
  # ^0.8.x - 0.8.15 satisfaz as 3 faixas sem exigir bump de major em nenhum
  # consumidor, sem manifesto próprio pro Dependabot propor um PR.
  "@xmldom/xmldom@0.8": ^0.8.15 # GHSA-6gmq-8vp8-gcm6, GHSA-965w-775f-mr7g, GHSA-4w3w-2rp5-g8jm, GHSA-8344-3jmq-59r6, GHSA-x4fp-j954-r2f4, GHSA-6h8r-xr42-gp59, GHSA-27p8-2357-5qqv, GHSA-w2rr-34g9-rvrj, GHSA-93r5-fhx6-vmg9, GHSA-c7q8-3ch8-vqpv
  # Adicionado 2026-09-17 (alertas #49, #64-#66) - @nestjs/platform-express
  # pina multer em "2.2.0" exato (sem caret), sem manifesto próprio pro
  # Dependabot propor um PR. 2.3.0 tem o mesmo footprint de dependências/
  # engine que 2.2.0 (confirmado via npm view) - bump seguro. Único caminho
  # transitivo genuinamente alcançável em produção desta janela (upload de
  # avatar/logo/anexo via multer real).
  multer@2: ^2.3.0 # GHSA-qfvm-cv95-jqjf, GHSA-535w-7cp7-47q4, GHSA-wc9g-mqfw-jrwm, GHSA-qvfw-j98x-7q72
  # Adicionado 2026-09-17 (alertas #44, #50) - transitiva de body-parser/
  # express (@nestjs/platform-express) e supertest, todas pinadas em
  # ^6.14.x/^6.15.x - 6.16.0 satisfaz as 3 faixas sem exigir bump de major.
  qs@6: ^6.16.0 # GHSA-x5fp-wj9c-mxmx, GHSA-4mjr-xmp4-gh2g
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  bcrypt: true
  esbuild: true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
patchedDependencies:
  eslint-plugin-react@7.37.5: patches/eslint-plugin-react@7.37.5.patch
